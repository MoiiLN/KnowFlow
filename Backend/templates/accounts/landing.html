<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnowFlow</title>
  {% load static %}
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">KnowFlow</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-primary" href="{% url 'login' %}">Iniciar sesión</a>
        <a class="btn btn-primary" href="{% url 'signup' %}">Registrarse</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 text-center">
        <h1 class="display-5 fw-bold">KnowFlow</h1>
        <p class="text-muted mt-3 mb-4">Empieza a organizar tu aprendizaje y crea tu cuenta.</p>
        <div class="d-flex justify-content-center gap-2">
          <a class="btn btn-primary" href="{% url 'signup' %}">Crear cuenta</a>
          <a class="btn btn-outline-primary" href="{% url 'login' %}">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
