version: '3.9'

services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    stdin_open: true
    tty: true
    environment:
      - DEBUG=1
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./:/app
      - /app/node_modules
