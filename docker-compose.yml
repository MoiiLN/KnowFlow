services:
  backend:
    build: ./Backend
    container_name: django
    volumes:
      - ./Backend:/app
      - static_volume:/app/public/static
      - media_volume:/app/public/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  worker:
    build: ./Backend
    container_name: django_worker
    command: python manage.py rqworker default
    volumes:
      - ./Backend:/app
      - static_volume:/app/public/static
      - media_volume:/app/public/media
    depends_on:
      - backend
      - redis
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis

  frontend:
    build: ./Frontend
    container_name: vue
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  static_volume:
  media_volume:
