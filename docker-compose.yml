services:
  backend:
    build: ./Backend
    container_name: django
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  worker:
    build: ./Backend
    container_name: django_worker
    command: python manage.py rqworker default
    volumes:
      - ./Backend:/app
    depends_on:
      - backend
      - redis
    env_file:
      - .env

  frontend:
    build: ./Frontend
    container_name: vue
    ports:
      - "80:80"
    depends_on:
      - backend
